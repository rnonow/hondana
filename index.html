<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わたしの本棚</title>
<meta name="theme-color" content="#6e4526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="本棚">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 静かで手ざわりのある、自分の部屋の本棚
   IDEA: 壁に据えた木の本棚。背表紙を並べ、好きな本だけ表紙を見せて飾る
   PICTURE: 本棚そのもの（棚板・影・背表紙・面陳）が画面の主役
   COLOUR/TYPE: 深い壁色＋胡桃材＋背表紙の色。Zen Kaku Gothic New
   LAYOUT: 上に細いツールバー、中央に本棚、右から詳細パネル */
:root{color-scheme:light dark;
--wall:#e7e2d8;--ink:#22201c;--mute:#6d675e;
--panel:#fffdf8;--line:#d6cfc2;
--wood:#8a5a35;--wood2:#6e4526;--woodhi:#b07c4f;
--back:#3b2a1e;--acc:#d9482b;--tray:#d9d2c5;--ok:#2f7d5b;--k:1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--wall:#1d2326;--ink:#ece7de;--mute:#a29b90;--panel:#272e31;--line:#3a4347;--wood:#6b4427;--wood2:#4f3019;--woodhi:#8a5b36;--back:#1a120c;--tray:#151a1c}}
:root[data-theme=dark]{color-scheme:dark;--wall:#1d2326;--ink:#ece7de;--mute:#a29b90;--panel:#272e31;--line:#3a4347;--wood:#6b4427;--wood2:#4f3019;--woodhi:#8a5b36;--back:#1a120c;--tray:#151a1c}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--wall);color:var(--ink);font:15px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;min-height:40px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:16px;width:100%}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:calc(14px + env(safe-area-inset-top)) max(3vw,14px,env(safe-area-inset-right)) 14px max(3vw,14px,env(safe-area-inset-left))}
h1{font-size:26px;line-height:1.05;margin:0 12px 0 0;font-weight:900;letter-spacing:.02em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.sp{flex:1}
main{padding:0 max(3vw,14px) 40px}
.note{color:var(--mute);font-size:13px;margin:4px 0 12px}
/* 本棚 */
.casebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.casebar select{width:auto}
.case{background:linear-gradient(90deg,var(--wood2),var(--wood) 6%,var(--wood) 94%,var(--wood2));padding:14px 14px 0;border-radius:6px 6px 0 0;box-shadow:0 18px 40px -18px #0008;max-width:1240px}
.shelf{position:relative;margin-bottom:14px}
.sname{position:absolute;left:8px;top:6px;z-index:2;font-size:12px;color:#f3e6d6;opacity:.75;background:none;border:0;padding:0;min-height:0}
.row{display:flex;align-items:flex-end;gap:2px;min-height:210px;padding:26px 12px 0;overflow-x:auto;overflow-y:hidden;
 background:linear-gradient(180deg,#0006,#0000 30%),var(--back);box-shadow:inset 0 8px 18px #000a,inset 8px 0 14px -6px #0009,inset -8px 0 14px -6px #0009;scrollbar-width:thin}
.board{height:16px;background:linear-gradient(180deg,var(--woodhi),var(--wood) 35%,var(--wood2));box-shadow:0 6px 8px -4px #0009}
.empty{color:#e8d9c6;opacity:.5;font-size:13px;align-self:center;margin:auto}
.bk{flex:none;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .15s;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.bk:hover{transform:translateY(-6px)}}
.bk.lift{transform:translateY(-10px) scale(1.06)}
body.dragging{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.spine{width:calc(var(--w) * var(--k));height:calc(var(--h) * var(--k));background:var(--c);border-radius:2px 2px 0 0;color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 8px;
 box-shadow:inset 3px 0 4px -2px #fff5,inset -4px 0 5px -2px #0007;overflow:hidden}
.spine .ti{writing-mode:vertical-rl;font-weight:700;font-size:13px;line-height:1.1;max-height:68%;overflow:hidden;letter-spacing:.06em}
.spine .au{writing-mode:vertical-rl;font-size:10px;opacity:.8;max-height:28%;overflow:hidden;white-space:nowrap}
.spine .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;object-position:left center;filter:blur(4px) brightness(.72) saturate(1.15)}
.spine .ti,.spine .au{position:relative}
.spine.hasimg{color:#fff;text-shadow:0 1px 3px #000c}
.spine.photo{padding:0}.spine.photo img{width:100%;height:100%;object-fit:cover;display:block}.spine.photo::before,.spine.photo::after{display:none}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:2px;background:#fff3}.spine::before{top:6px}.spine::after{bottom:4px}
.face{height:calc(var(--fh) * var(--k));width:calc(var(--fh) * var(--k) * .7);margin:0 6px;box-shadow:6px 4px 10px #000a;position:relative;background:var(--c);overflow:hidden;border-radius:1px}
.face img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.gen{position:absolute;inset:0;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;color:var(--t)}
.gen b{font-size:15px;line-height:1.25;text-wrap:balance}.gen small{font-size:11px;opacity:.85}
.gen::after{content:"";position:absolute;left:0;right:0;top:38%;height:3px;background:currentColor;opacity:.25}
.face .stand{display:none}
.bk.st-done::after,.bk.st-reading::after{content:"";position:absolute;top:-8px;left:50%;translate:-50%;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.bk.st-reading::after{background:#e2b23a}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;rotate:-3deg;filter:drop-shadow(0 12px 16px #0008)}
.bk.dragging{opacity:.25}
.mark{flex:none;width:4px;height:150px;background:var(--acc);border-radius:2px;box-shadow:0 0 0 3px #d9482b55}
.tray{margin-top:22px;max-width:1240px}
.tray h3,.sec h3{font-size:16px;margin:0 0 6px}
.tray .row{background:var(--tray);box-shadow:inset 0 4px 10px #0003;min-height:170px;border-radius:6px}
.tray .empty{color:var(--mute);opacity:1}
/* パネル */
.panel{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--panel);box-shadow:-20px 0 40px #0005;padding:20px;overflow:auto;z-index:40;translate:105% 0;visibility:hidden;transition:translate .25s,visibility .25s}
.panel.open{translate:0;visibility:visible}
.panel h2{font-size:20px;margin:0 0 12px;line-height:1.3}
.fld{margin-bottom:10px}.fld label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.x{float:right;min-height:36px;padding:4px 12px}
.prev{display:flex;gap:14px;align-items:flex-end;margin:6px 0 14px}
.prev .face{--fh:150px;--k:1;margin:0}
.msg{font-size:13px;color:var(--mute);min-height:1.5em}
.msg.err{color:var(--acc)}
/* 一覧・新刊 */
.sec{max-width:1240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 14px;margin-top:12px}
.card{white-space:normal;background:none;border:0;padding:0;text-align:left;min-height:0;display:flex;flex-direction:column;gap:6px}
.card .face{--fh:170px;--k:1;margin:0;width:100%;height:auto;aspect-ratio:.7}
.card .t{font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{font-size:12px;color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{flex:1 1 220px;width:auto}.filters select{width:auto}
.follow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border-radius:99px;padding:4px 6px 4px 12px;min-height:34px;display:inline-flex;gap:6px;align-items:center}
.chip span{font-size:13px}.chip i{font-style:normal;opacity:.6;padding:0 6px}
.rel{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rel .face{--fh:100px;--k:1;margin:0}
.rel .d{font-size:12px;color:var(--mute)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--acc);color:#fff;margin-left:6px}
.badge.own{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:20px;translate:-50%;background:var(--ink);color:var(--wall);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
[hidden]{display:none!important}
.selbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;max-width:1240px}
.selbar button{padding:6px 12px;min-height:38px}
#selMode[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.bk.sel{transform:translateY(-8px)}.bk.sel>*{outline:3px solid #ffb703;outline-offset:1px}
.ghost .cnt{position:absolute;top:-10px;right:-10px;z-index:3;background:var(--acc);color:#fff;font-size:13px;font-weight:700;border-radius:99px;padding:2px 8px}
.case,.tray .row,.face,.spine,.ghost,.scan{forced-color-adjust:none}
.scan{position:relative;background:#000;border-radius:10px;overflow:hidden;min-height:220px;margin:8px 0}
.scan video{width:100%;max-height:42vh;object-fit:cover;display:block}
.scan .flash{position:absolute;left:8%;right:8%;top:38%;z-index:3;text-align:center;font-weight:700;font-size:18px;color:#fff;background:#2f7d5bee;border-radius:12px;padding:10px 12px;opacity:0;transform:scale(.9);transition:opacity .15s,transform .15s;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan .flash.on{opacity:1;transform:none}.scan .flash.warn{background:#b4532aee}
.scan .guide{position:absolute;left:5%;right:5%;top:25%;bottom:25%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px #0006}
.scan .scanhint{position:absolute;left:0;right:0;bottom:0;margin:0;padding:6px 10px;font-size:13px;color:#fff;background:#0008;text-align:center}
@media(max-width:600px){
 :root{--k:.82}
 .spine .ti{font-size:11.5px;letter-spacing:0}.spine .au{font-size:9px}
 #v-shelf>.note{font-size:12px;margin:0 0 8px}
 h1{font-size:21px;margin:0}header{gap:8px}header .pri{padding:8px 12px}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;gap:0;flex-wrap:nowrap;background:var(--panel);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
 .tabs button{flex:1;border:0;border-radius:10px;min-height:48px;font-size:14px;background:none}
 .tabs button[aria-pressed=true]{background:var(--ink);color:var(--wall)}
 main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
 .casebar{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * max(3vw,14px)) 6px;padding:2px max(3vw,14px);scrollbar-width:none}
 .casebar>*{flex:none}.casebar button{padding:6px 12px;font-size:14px}
 .row{min-height:170px;padding:24px 8px 0}.case{padding:8px 6px 0;margin:0 -6px}
 .tray .row{min-height:140px}
 .panel{inset:auto 0 0 0;width:100%;max-height:88dvh;border-radius:18px 18px 0 0;translate:0 105%;box-shadow:0 -10px 40px #0005;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
 .panel::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
 .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
 .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px 10px}
 .rel{grid-template-columns:60px minmax(0,1fr) auto}.rel .face{--fh:84px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>わたしの本棚</h1>
  <nav class="tabs" id="tabs">
    <button data-v="shelf" aria-pressed="true">本棚</button>
    <button data-v="list" aria-pressed="false">蔵書一覧</button>
    <button data-v="news" aria-pressed="false">新刊チェック</button>
  </nav>
  <span class="sp"></span>
  <button class="pri" id="addBtn">＋ 本を追加</button>
  <button id="ioBtn">データ</button>
</header>

<main>
  <section id="v-shelf">
    <div class="casebar">
      <select id="caseSel" aria-label="本棚を選ぶ"></select>
      <button id="caseNew">本棚を追加</button>
      <button id="caseRen">名前変更</button>
      <button id="shelfNew">段を追加</button>
      <button id="caseDel">本棚を削除</button>
      <button id="selMode" aria-pressed="false">まとめて選ぶ</button>
    </div>
    <p class="note">本を長押し（パソコンはドラッグ）すると持ち上がり、好きな段・位置へ動かせます。タップで詳細を開き「表紙を見せて飾る」にすると面陳になります。</p>
    <div class="selbar" id="selbar" hidden><b id="selN">0冊</b><button id="selSeries">シリーズごと選ぶ</button><button id="selSort">巻数順に並べる</button><button id="selColor">色を変える</button><button id="selClr">選択をやめる</button>
      <p class="note" style="flex-basis:100%;margin:0">本をタップして選び、選んだ本のどれかを長押し（パソコンはドラッグ）すると、まとめて動かせます。</p></div>
    <div class="case" id="case"></div>
    <div class="tray">
      <h3>未配置の本</h3>
      <div class="row" id="tray" data-shelf="tray"></div>
    </div>
  </section>

  <section id="v-list" class="sec" hidden>
    <div class="filters">
      <input id="q" placeholder="タイトル・著者・出版社で検索" aria-label="検索">
      <select id="fst" aria-label="状態"><option value="">すべての状態</option><option value="unread">積読</option><option value="reading">読書中</option><option value="done">読了</option><option value="wish">欲しい</option></select>
      <select id="sort" aria-label="並び順"><option value="added">追加が新しい順</option><option value="title">タイトル順</option><option value="author">著者順</option><option value="pub">発売日が新しい順</option></select>
    </div>
    <p class="note" id="count"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="v-news" class="sec" hidden>
    <h3>新刊チェック</h3>
    <p class="note">本棚にある本のシリーズと著者から、最近90日に出た本と発売予定の本を自動で探します（国立国会図書館サーチ）。アプリを開いた時に半日に1回確認します。</p>
    <div class="filters" style="align-items:center"><button class="pri" id="fcheck">今すぐ確認</button><span class="note" id="nlast" style="margin:0"></span></div>
    <p class="msg" id="nmsg"></p>
    <div id="news"></div>
    <details id="nset" style="margin-top:18px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center">▸ 追いかける対象の設定</summary>
      <p class="note" id="ntgt"></p>
      <h3 style="font-size:14px">追わないにしたもの（タップで元に戻す）</h3><div class="follow" id="mutes"></div>
      <h3 style="font-size:14px">本棚にない著者・シリーズも追う</h3>
      <div class="filters"><input id="fq" placeholder="著者名やシリーズ名" aria-label="追加で追う著者・シリーズ"><select id="ft" aria-label="種類"><option value="author">著者</option><option value="title">シリーズ</option></select><button id="fadd">追加</button></div>
      <div class="follow" id="follows"></div>
    </details>
  </section>
</main>

<aside class="panel" id="panel" aria-label="本の詳細"></aside>
<div class="toast" id="toast"></div>
<input type="file" id="imgIn" accept="image/*" hidden>
<input type="file" id="jsonIn" accept="application/json" hidden>

<script>
{
const KEY='hondana.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const PAL=[['#2d4a6b','#f1e9da'],['#7d2a2a','#f6e7d7'],['#e5c76b','#2a2420'],['#3d6b4f','#f2efe6'],['#ddd5c4','#2c2a26'],['#1f1f22','#e9c46a'],['#b4532a','#fff3e4'],['#5b4b8a','#f3eefc'],['#8fb3c9','#1c2a33'],['#c98b8b','#2b1d1d'],['#f2f0ea','#b4532a'],['#2a6f73','#fbefd9']];
const ST={unread:'積読',reading:'読書中',done:'読了',wish:'欲しい'};

function sample(){
  const B=[
    ['9784101010137','こころ','夏目漱石','新潮社','2004'],['9784101010014','吾輩は猫である','夏目漱石','新潮社','2003'],
    ['9784062748681','ノルウェイの森 上','村上春樹','講談社','2004'],['9784101215235','博士の愛した数式','小川洋子','新潮社','2005'],
    ['9784591153321','かがみの孤城','辻村深月','ポプラ社','2017'],['9784893095626','りんごかもしれない','ヨシタケシンスケ','ブロンズ新社','2013'],
    ['9784167911300','コンビニ人間','村田沙耶香','文藝春秋','2018'],['9784101092058','新編 銀河鉄道の夜','宮沢賢治','新潮社','1989'],
    ['9784167910105','羊と鋼の森','宮下奈都','文藝春秋','2018'],['9784101369181','火車','宮部みゆき','新潮社','1998'],
    ['9784102122044','星の王子さま','サン＝テグジュペリ','新潮社','2006'],['9784101006055','人間失格','太宰治','新潮社','2006']];
  const books={};const ids=B.map(([isbn,title,author,publisher,pubdate],i)=>{const id=uid();books[id]={id,isbn,title,author,publisher,pubdate,status:['done','unread','reading','done'][i%4],mode:(i===4||i===5)?'face':'spine',memo:'',added:Date.now()-i*864e5,cover:''};return id});
  return {books,tray:[],follows:[],
    cases:[{id:uid(),name:'リビングの本棚',shelves:[{id:uid(),name:'上段',books:ids.slice(0,6)},{id:uid(),name:'中段',books:ids.slice(6,10)},{id:uid(),name:'下段',books:ids.slice(10)}]}],cur:null,sample:true};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cases||(S.sample&&Object.values(S.books).every(b=>!b.isbn))){S=sample();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.cur||!S.cases.find(c=>c.id===S.cur))S.cur=S.cases[0].id;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('この環境では保存できません')}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)};
const curCase=()=>S.cases.find(c=>c.id===S.cur);

/* ---- シリーズと巻数（書名の末尾の数字・上中下から自動判定。詳細画面で直せる） ---- */
const z2h=t=>String(t||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
const VOL_RE=/[\s　]*(?:[（(［\[]\s*)?(?:第|vol\.?|Vol\.?|VOL\.?|#)?\s*(\d{1,4}|上|中|下)\s*(?:巻|集|号)?\s*(?:[)）］\]])?\s*$/;
function volOf(b){if(b.vol!==undefined&&b.vol!=='')return parseFloat(z2h(b.vol))||0;const m=z2h(b.title).match(VOL_RE);if(!m)return 0;return {上:1,中:2,下:3}[m[1]]||parseInt(m[1])}
function seriesOf(b){if(b.series)return b.series.trim();const t=z2h(b.title);const m=t.match(VOL_RE);return (m?t.slice(0,m.index):t).replace(/[\s　.,:：・-]+$/,'').trim()}
const byVol=(a,b)=>seriesOf(S.books[a]).localeCompare(seriesOf(S.books[b]),'ja')||volOf(S.books[a])-volOf(S.books[b]);
/* ---- 本の見た目 ---- */
/* 背表紙は単色。同じシリーズは色・高さ・幅がそろう。色は 本ごとの指定 → シリーズの指定 → 自動 の順 */
const skey=b=>z2h(seriesOf(b)).toLowerCase().replace(/[\s　]+/g,'');
function look(b,own=true){const k=skey(b),h=hash(k||b.isbn||b.title);const st=(S.seriesStyle||{})[k];
  const p=own&&b.color?[b.color,b.tcolor||'#ffffff']:st?[st.c,st.t]:PAL[h%PAL.length];
  return {c:p[0],t:p[1],h:150+(h%5)*10,w:30+(hash(k+'w')%4)*6}}
const seriesBooks=b=>{const k=skey(b);return Object.values(S.books).filter(x=>skey(x)===k)};
/* 表紙画像：自分で選んだ画像 → ISBNから Google ブックスの表紙画像（画像がない本は灰色の仮画像が返るので、幅で見分けて外す） */
const coverSrc=b=>b.cover||(b.isbn&&/^97[89]\d{10}$/.test(b.isbn)?`https://books.google.com/books/content?vid=ISBN${b.isbn}&printsec=frontcover&img=1&zoom=1&fife=w400`:'');
const IMG_ON=`onerror="this.remove()" onload="if(this.dataset.g&&this.naturalWidth<=130){this.remove()}else{this.parentNode.classList.add('hasimg')}"`;
function coverHTML(b){const src=coverSrc(b);
  return `<div class="gen"><b>${esc(b.title)}</b><small>${esc(b.author)}</small></div>`+
    (src?`<img src="${esc(src)}" alt="" loading="lazy" ${b.cover?'':'data-g="1"'} ${IMG_ON}>`:'');}
function faceHTML(b,fh){const L=look(b);return `<div class="face" style="--c:${L.c};--t:${L.t};--fh:${fh||L.h}px">${coverHTML(b)}</div>`}
function bookHTML(id){const b=S.books[id];if(!b)return '';const L=look(b);
  const src=coverSrc(b);
  const inner=b.mode==='face'?faceHTML(b,L.h+10):
    b.spine?`<div class="spine photo" style="--c:${L.c};--h:${L.h}px;--w:${b.spineW||L.w}px"><img src="${esc(b.spine)}" alt=""></div>`:
    `<div class="spine" style="--c:${L.c};--t:${L.t};--h:${L.h}px;--w:${L.w}px"><span class="ti">${esc(b.title)}</span><span class="au">${esc(b.author)}</span></div>`;
  return `<div class="bk st-${b.status}${SEL.has(id)?' sel':''}" data-id="${id}" title="${esc(b.title)} / ${esc(b.author)}" tabindex="0">${inner}</div>`}

/* ---- 本棚 ---- */
function renderShelf(){
  $('#caseSel').innerHTML=S.cases.map(c=>`<option value="${c.id}" ${c.id===S.cur?'selected':''}>${esc(c.name)}</option>`).join('');
  const c=curCase();
  $('#case').innerHTML=c.shelves.map(s=>`<div class="shelf"><button class="sname" data-sid="${s.id}" title="段の名前を変更・削除">${esc(s.name)}</button>
    <div class="row" data-shelf="${s.id}">${s.books.map(bookHTML).join('')||'<span class="empty">ここに本をドラッグ</span>'}</div><div class="board"></div></div>`).join('');
  S.tray=S.tray.filter(id=>S.books[id]);
  $('#tray').innerHTML=S.tray.map(bookHTML).join('')||'<span class="empty">ここに置いた本は本棚に並びません</span>';
}
const listOf=sid=>sid==='tray'?S.tray:S.cases.flatMap(c=>c.shelves).find(s=>s.id===sid)?.books;
function removeEverywhere(id){S.tray=S.tray.filter(x=>x!==id);for(const c of S.cases)for(const s of c.shelves)s.books=s.books.filter(x=>x!==id)}
function placeOf(id){if(S.tray.includes(id))return '未配置';for(const c of S.cases)for(const s of c.shelves)if(s.books.includes(id))return `${c.name} / ${s.name}`;return ''}

/* まとめて選ぶ */
let SELMODE=false;const SEL=new Set();
function renderSel(){$('#selbar').hidden=!SELMODE;$('#selMode').setAttribute('aria-pressed',SELMODE);$('#selN').textContent=SEL.size+'冊選択中';
  for(const el of document.querySelectorAll('#v-shelf .bk'))el.classList.toggle('sel',SEL.has(el.dataset.id))}
$('#selMode').onclick=()=>{SELMODE=!SELMODE;if(!SELMODE)SEL.clear();renderSel()};
$('#selClr').onclick=()=>{SEL.clear();SELMODE=false;renderSel()};
$('#selColor').onclick=()=>{if(!SEL.size)return toast('先に本を選んでください');const f=S.books[[...SEL][0]];const L=look(f);
  openPanel(`<button class="x" data-close>閉じる</button><h2>${SEL.size}冊の背表紙の色</h2>
   <div class="two"><div class="fld"><label>背表紙の色</label><input type="color" id="mc" value="${L.c}" style="height:48px;padding:2px"></div><div class="fld"><label>文字の色</label><input type="color" id="mt" value="${L.t}" style="height:48px;padding:2px"></div></div>
   <div class="prev" style="gap:4px" id="mprev"></div>
   <div class="btns"><button class="pri" id="mOk">まとめて変える</button><button id="mReset">自動の色に戻す</button></div>`);
  const pv=()=>{$('#mprev').innerHTML=[...SEL].slice(0,8).map(id=>{const b=S.books[id],l=look(b);return `<div class="spine" style="--k:1;--c:${$('#mc').value};--t:${$('#mt').value};--h:${l.h}px;--w:${l.w}px"><span class="ti">${esc(b.title)}</span></div>`}).join('')};
  pv();$('#mc').oninput=pv;$('#mt').oninput=pv;
  $('#mOk').onclick=()=>{for(const id of SEL){S.books[id].color=$('#mc').value;S.books[id].tcolor=$('#mt').value}save();renderShelf();renderSel();closePanel();toast('色を変えました')};
  $('#mReset').onclick=()=>{for(const id of SEL){delete S.books[id].color;delete S.books[id].tcolor;if(S.seriesStyle)delete S.seriesStyle[skey(S.books[id])]}save();renderShelf();renderSel();closePanel();toast('自動の色に戻しました')}};
$('#selSeries').onclick=()=>{if(!SEL.size)return toast('先にシリーズの本を1冊タップしてください');const ser=new Set([...SEL].map(id=>seriesOf(S.books[id])));
  for(const b of Object.values(S.books))if(ser.has(seriesOf(b))&&placeOf(b.id))SEL.add(b.id);renderSel();toast(`${SEL.size}冊を選びました`)};
$('#selSort').onclick=()=>{if(SEL.size<2)return toast('2冊以上選んでください');
  const slots=[...S.cases.flatMap(c=>c.shelves.map(s=>s.id)),'tray'];const sid=slots.find(x=>listOf(x).some(id=>SEL.has(id)));const at=listOf(sid).findIndex(id=>SEL.has(id));
  const ids=[...SEL].sort(byVol);for(const id of ids)removeEverywhere(id);listOf(sid).splice(at,0,...ids);save();renderShelf();toast('巻数順に並べました')};
/* ドラッグ：マウスはそのまま、タッチは長押し（約0.4秒）で持ち上げる */
let D=null;
function startDrag(x,y){D.on=true;const r=D.el.getBoundingClientRect();D.dx=x-r.left;D.dy=y-r.top;
  D.group=SEL.has(D.id)&&SEL.size>1?[...SEL]:null;
  D.g=D.el.cloneNode(true);D.g.classList.remove('lift','sel');D.g.classList.add('ghost');if(D.group){D.g.insertAdjacentHTML('beforeend',`<span class="cnt">${D.group.length}冊</span>`);for(const el of document.querySelectorAll('#v-shelf .bk.sel'))el.classList.add('dragging')}document.body.append(D.g);
  D.g.style.left=r.left+'px';D.g.style.top=r.top+'px';D.el.classList.add('dragging');document.body.classList.add('dragging');
  D.m=document.createElement('div');D.m.className='mark'}
function endDrag(){if(!D)return;clearTimeout(D.timer);D.el.classList.remove('lift','dragging');for(const el of document.querySelectorAll('#v-shelf .bk.dragging'))el.classList.remove('dragging');document.body.classList.remove('dragging');D.g?.remove();D.m?.remove()}
document.addEventListener('pointerdown',e=>{
  const bk=e.target.closest('#v-shelf .bk');if(!bk||e.button>0)return;
  D={id:bk.dataset.id,el:bk,x:e.clientX,y:e.clientY,on:false,touch:e.pointerType!=='mouse'};
  if(D.touch){const d=D;d.timer=setTimeout(()=>{if(D!==d)return;bk.classList.add('lift');navigator.vibrate?.(12);startDrag(d.lx??d.x,d.ly??d.y)},400)}
});
document.addEventListener('touchmove',e=>{if(D?.on)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.bk'))e.preventDefault()});
document.addEventListener('pointermove',e=>{
  if(!D)return;D.lx=e.clientX;D.ly=e.clientY;
  if(!D.on){const mv=Math.hypot(e.clientX-D.x,e.clientY-D.y);
    if(D.touch){if(mv>10){endDrag();D=null}return}
    if(mv<6)return;startDrag(e.clientX,e.clientY)}
  e.preventDefault();
  D.g.style.left=e.clientX-D.dx+'px';D.g.style.top=e.clientY-D.dy+'px';
  const row=document.elementFromPoint(e.clientX,e.clientY)?.closest('.row');
  if(!row){D.m.remove();D.to=null}else{
  const kids=[...row.querySelectorAll('.bk')].filter(k=>k!==D.el&&!(D.group&&SEL.has(k.dataset.id)));
  let i=kids.findIndex(k=>{const r=k.getBoundingClientRect();return e.clientX<r.left+r.width/2});
  if(i<0)i=kids.length;
  row.querySelector('.empty')?.setAttribute('hidden','');
  if(i<kids.length)row.insertBefore(D.m,kids[i]);else row.append(D.m);
  D.to={sid:row.dataset.shelf,ref:kids[i]?.dataset.id};
  const rr=row.getBoundingClientRect();if(e.clientX>rr.right-30)row.scrollLeft+=10;if(e.clientX<rr.left+30)row.scrollLeft-=10}
  if(e.clientY<60)scrollBy(0,-12);if(e.clientY>innerHeight-90)scrollBy(0,12);
},{passive:false});
document.addEventListener('pointerup',()=>{
  if(!D)return;const d=D;endDrag();D=null;
  if(!d.on){if(SELMODE){SEL.has(d.id)?SEL.delete(d.id):SEL.add(d.id);renderSel()}else openBook(d.id);return}
  if(d.to){const ids=d.group?d.group.sort(byVol):[d.id];for(const id of ids)removeEverywhere(id);const L=listOf(d.to.sid);const at=d.to.ref?L.indexOf(d.to.ref):L.length;L.splice(at<0?L.length:at,0,...ids);save();if(d.group)toast(`${ids.length}冊を巻数順に移動しました`)}
  renderShelf();
});
document.addEventListener('pointercancel',()=>{if(!D)return;const on=D.on;endDrag();D=null;if(on)renderShelf()});
document.addEventListener('keydown',e=>{const bk=e.target.closest?.('.bk');if(bk&&e.key==='Enter')openBook(bk.dataset.id);if(e.key==='Escape')closePanel()});

$('#caseSel').onchange=e=>{S.cur=e.target.value;save();renderShelf()};
$('#caseNew').onclick=()=>ask('新しい本棚の名前','寝室の本棚',v=>{const c={id:uid(),name:v,shelves:[1,2,3].map(n=>({id:uid(),name:n+'段目',books:[]}))};S.cases.push(c);S.cur=c.id;save();renderShelf()});
$('#caseRen').onclick=()=>ask('本棚の名前',curCase().name,v=>{curCase().name=v;save();renderShelf()});
$('#shelfNew').onclick=()=>{const c=curCase();c.shelves.push({id:uid(),name:(c.shelves.length+1)+'段目',books:[]});save();renderShelf()};
$('#caseDel').onclick=()=>{if(S.cases.length<2)return toast('本棚は最低1つ必要です');const c=curCase();
  confirmP(`「${c.name}」を削除します。並んでいた本は「未配置」に移ります。`,()=>{for(const s of c.shelves)S.tray.push(...s.books);S.cases=S.cases.filter(x=>x!==c);S.cur=S.cases[0].id;save();renderShelf()})};
$('#case').addEventListener('click',e=>{const b=e.target.closest('.sname');if(!b)return;const c=curCase();const s=c.shelves.find(x=>x.id===b.dataset.sid);
  openPanel(`<button class="x" data-close>閉じる</button><h2>段の設定</h2><div class="fld"><label>段の名前</label><input id="sn" value="${esc(s.name)}"></div>
  <div class="btns"><button class="pri" id="snOk">保存</button><button id="snDel">この段を削除</button></div>
  <div class="btns"><button id="snTidy">シリーズを巻数順に整える</button></div><p class="msg">同じシリーズの本を、最初の1冊の位置に巻数順でまとめます。</p><p class="msg">削除すると、この段の本は「未配置」に移ります。</p>`);
  $('#snOk').onclick=()=>{s.name=$('#sn').value.trim()||s.name;save();renderShelf();closePanel()};
  $('#snTidy').onclick=()=>{const out=[],done=new Set();for(const id of s.books){if(done.has(id))continue;const ser=seriesOf(S.books[id]);const grp=s.books.filter(x=>!done.has(x)&&seriesOf(S.books[x])===ser).sort(byVol);grp.forEach(x=>done.add(x));out.push(...grp)}
    s.books=out;save();renderShelf();closePanel();toast('巻数順に整えました')};
  $('#snDel').onclick=()=>{if(c.shelves.length<2)return toast('段は最低1つ必要です');S.tray.push(...s.books);c.shelves=c.shelves.filter(x=>x!==s);save();renderShelf();closePanel()};
});

/* ---- パネル共通 ---- */
const panel=$('#panel');
const coarse=matchMedia('(pointer:coarse)').matches;
function openPanel(h){stopScan();panel.innerHTML=h;panel.classList.add('open');if(!coarse)panel.querySelector('input,button.pri')?.focus()}
function closePanel(){stopScan();panel.classList.remove('open')}
panel.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closePanel()});
function ask(label,val,cb){openPanel(`<button class="x" data-close>閉じる</button><h2>${esc(label)}</h2><div class="fld"><input id="askv" value="${esc(val)}"></div><div class="btns"><button class="pri" id="askOk">決定</button></div>`);
  const go=()=>{const v=$('#askv').value.trim();if(v){cb(v);closePanel()}};$('#askOk').onclick=go;$('#askv').onkeydown=e=>{if(e.key==='Enter')go()}}
function confirmP(t,cb){openPanel(`<button class="x" data-close>閉じる</button><h2>確認</h2><p>${esc(t)}</p><div class="btns"><button class="pri" id="cfOk">実行する</button><button data-close>やめる</button></div>`);$('#cfOk').onclick=()=>{cb();closePanel()}}

/* ---- 本の詳細・編集 ---- */
function form(b){return `
  <div class="prev">${faceHTML(b,150)}<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><button id="imgBtn">表紙を写真にする</button><button id="spBtn">背表紙を写真にする</button>${b.cover||b.spine?'<button id="imgClr">写真を外す</button>':''}<p class="msg" style="margin:0">表紙はISBNから自動で表示します。出ない時や背表紙を本物にしたい時は撮影してください</p></div></div>
  <div class="fld"><label>タイトル</label><input id="f-title" value="${esc(b.title)}"></div>
  <div class="two"><div class="fld"><label>著者</label><input id="f-author" value="${esc(b.author)}"></div><div class="fld"><label>出版社</label><input id="f-publisher" value="${esc(b.publisher)}"></div></div>
  <div class="two"><div class="fld"><label>発売日</label><input id="f-pubdate" value="${esc(b.pubdate)}"></div><div class="fld"><label>ISBN</label><input id="f-isbn" value="${esc(b.isbn)}" inputmode="numeric"></div></div>
  <div class="two"><div class="fld"><label>状態</label><select id="f-status">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${b.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div class="fld"><label>本棚での見せ方</label><select id="f-mode"><option value="spine" ${b.mode!=='face'?'selected':''}>背表紙で並べる</option><option value="face" ${b.mode==='face'?'selected':''}>表紙を見せて飾る</option></select></div></div>
  <div class="two"><div class="fld"><label>背表紙の色</label><input type="color" id="f-color" value="${look(b).c}" style="height:42px;padding:2px"></div><div class="fld"><label>文字の色</label><input type="color" id="f-tcolor" value="${look(b).t}" style="height:42px;padding:2px"></div></div>
  ${(()=>{const n=seriesBooks(b).filter(x=>x.id!==b.id).length;return n?`<label class="fld" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-sall" checked style="width:22px;height:22px"> 同じシリーズのほかの${n}冊にも同じ色を使う</label>`:''})()}
  <div class="two"><div class="fld"><label>シリーズ（空欄なら書名から自動）</label><input id="f-series" value="${esc(b.series||'')}" placeholder="${esc(seriesOf({...b,series:''}))}"></div><div class="fld"><label>巻</label><input id="f-vol" inputmode="decimal" value="${esc(b.vol??'')}" placeholder="${volOf({...b,vol:''})||''}"></div></div>
  <div class="fld"><label>メモ</label><textarea id="f-memo" rows="3">${esc(b.memo)}</textarea></div>`}
function readForm(b){for(const k of ['title','author','publisher','pubdate','isbn','status','mode','memo','series','vol'])b[k]=$('#f-'+k).value.trim();
  const c=$('#f-color').value,t=$('#f-tcolor').value;const L0=look(b);
  if(c!==L0.c||t!==L0.t){if($('#f-sall')?.checked){S.seriesStyle=S.seriesStyle||{};S.seriesStyle[skey(b)]={c,t};for(const x of seriesBooks(b)){delete x.color;delete x.tcolor}delete b.color;delete b.tcolor}else{b.color=c;b.tcolor=t}}
  b.isbn=normIsbn(b.isbn)||b.isbn}
function bindImg(b){
  const pick=cb=>{const inp=$('#imgIn');inp.value='';inp.onchange=()=>{const f=inp.files[0];if(f)cb(f)};inp.click()};
  $('#imgBtn').onclick=()=>pick(f=>shrink(f,360).then(u=>{b.cover=u;$('.prev .face').outerHTML=faceHTML(b,150);toast('表紙を設定しました')}));
  $('#spBtn').onclick=()=>pick(f=>shrink(f,600,true).then(([u,r])=>{b.spine=u;b.spineW=Math.round(Math.max(16,Math.min(70,look(b).h*r)));toast('背表紙を設定しました。保存すると本棚に反映されます')}));
  const clr=$('#imgClr');if(clr)clr.onclick=()=>{delete b.cover;delete b.spine;delete b.spineW;$('.prev .face').outerHTML=faceHTML(b,150);clr.remove();toast('写真を外しました')}}
function shrink(f,max=360,ratio=false){return new Promise(r=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.82);r(ratio?[u,img.width/img.height]:u)};img.src=URL.createObjectURL(f)})}

function openBook(id){const b=S.books[id];if(!b)return;const tmp={...b};
  openPanel(`<button class="x" data-close>閉じる</button><h2>${esc(b.title)}</h2><p class="msg">場所：${esc(placeOf(id))}</p>${form(tmp)}
   <div class="btns"><button class="pri" id="bSave">保存</button><button id="bDel">削除</button></div>`);
  bindImg(tmp);
  $('#bSave').onclick=()=>{readForm(tmp);S.books[id]=tmp;save();renderAll();closePanel();toast('保存しました')};
  $('#bDel').onclick=()=>confirmP(`「${b.title}」を蔵書から削除します。`,()=>{removeEverywhere(id);delete S.books[id];save();renderAll()});
}

/* ---- 追加：ISBN検索 ---- */
function normIsbn(s){s=String(s||'').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(s.length===10){const b='978'+s.slice(0,9);let t=0;for(let i=0;i<12;i++)t+=+b[i]*(i%2?3:1);return b+((10-t%10)%10)}
  return s.length===13?s:''}
async function lookup(isbn){
  try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn);const j=await r.json();const s=j?.[0]?.summary;
    if(s)return {title:[s.title,s.volume].filter(Boolean).join(' '),author:obdAuthor(s.author),publisher:s.publisher||'',pubdate:fmtDate(s.pubdate),cover:s.cover||'',src:'openBD'}}catch(e){}
  try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);const j=await r.json();const v=j.items?.[0]?.volumeInfo;
    if(v)return {title:[v.title,v.subtitle].filter(Boolean).join(' '),author:(v.authors||[]).join('・'),publisher:v.publisher||'',pubdate:v.publishedDate||'',cover:(v.imageLinks?.thumbnail||'').replace('http:','https:'),src:'Google Books'}}catch(e){}
  try{const r=await ndl('isbn='+isbn+'&cnt=5');const n=r.find(x=>x.isbn===isbn)||r[0];if(n)return {...n,isbn,src:'国立国会図書館サーチ'}}catch(e){}
  return null}
const obdAuthor=t=>{t=String(t||'').replace(/\s*(／|\/)?\s*(著|作|文|絵|訳|編)(?=\s|$)/g,' ').trim();return t.includes(',')?t.split(/\s+/).map(ndlName).filter(Boolean).join('・'):t.replace(/[／]/g,'・')};

  $('#mutes').innerHTML=(S.mute||[]).map((k,i)=>`<button class="chip" data-um="${i}">${esc(k.slice(2))} <i>戻す</i></button>`).join('')||'<span class="note">なし</span>';
  $('#follows').innerHTML=(S.follows||[]).map((f,i)=>`<button class="chip" data-rm="${i}">${f.type==='author'?'著者':'シリーズ'}：${esc(f.q)} <i>×</i></button>`).join('');
  if(!NEWS_RUN&&N){m.className='msg'+(N.fail?' err':'');m.textContent=N.fail?'新刊情報に接続できませんでした。少し待って「今すぐ確認」を押してください':N.items.length?`${N.items.length}冊見つかりました（持っている本は除いています）`:'最近の新刊は見つかりませんでした'}
  const items=N?.items||[];
  $('#news').innerHTML=items.map((n,i)=>`<div class="rel">${faceHTML(n,100)}<div><b>${esc(n.title)}</b>${n.pubdate>today?'<span class="badge">発売予定</span>':''}
    <div class="d">${esc(n.author)}・${esc(n.publisher)}・${esc(n.pubdate)}</div><div class="d">${esc(n.label)}　<button class="chip" style="min-height:30px;padding:2px 10px" data-mute="${i}">この${n.key[0]==='a'?'著者':'シリーズ'}を追わない</button></div></div>
    <button data-n="${i}">追加</button></div>`).join('');}
$('#news').onclick=e=>{const items=S.news?.items||[];const today=new Date().toISOString().slice(0,10);
  const mu=e.target.closest('[data-mute]');if(mu){const n=items[+mu.dataset.mute];S.mute=[...new Set([...(S.mute||[]),n.key])];S.news.items=items.filter(x=>x.key!==n.key);save();renderNews();renderBadge();toast('次から追いません');return}
  const b=e.target.closest('[data-n]');if(!b)return;const n=items[+b.dataset.n];const{key,label,...rest}=n;addBook({...rest,status:n.pubdate>today?'wish':'unread'})};
$('#mutes').onclick=e=>{const b=e.target.closest('[data-um]');if(b){S.mute.splice(+b.dataset.um,1);save();renderNews()}};
$('#follows').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){S.follows.splice(+b.dataset.rm,1);save();renderNews()}};
$('#fadd').onclick=()=>{const q=$('#fq').value.trim();if(!q)return;S.follows=S.follows||[];S.follows.push({q,type:$('#ft').value});$('#fq').value='';save();renderNews();toast('追加しました。「今すぐ確認」で探せます')};
$('#fq').onkeydown=e=>{if(e.key==='Enter')$('#fadd').click()};
$('#fcheck').onclick=()=>checkNews();
const newsStale=()=>!S.news||Date.now()-S.news.t>12*3600e3;
/* ---- データ入出力 ---- */
$('#ioBtn').onclick=()=>{openPanel(`<button class="x" data-close>閉じる</button><h2>データ</h2>
  <p class="msg">蔵書はこのブラウザの中（localStorage）に保存されています。別の端末へ移す時やバックアップには書き出しを使ってください。</p>
  <div class="btns"><button class="pri" id="ex">ファイルに書き出す</button><button id="cp">JSONをコピー</button><button id="im">ファイルから読み込む</button><button id="clr">空にする</button></div>`);
  const json=()=>JSON.stringify(S,null,1);
  $('#ex').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json()],{type:'application/json'}));a.download='hondana-'+new Date().toISOString().slice(0,10)+'.json';a.click()}catch(e){toast('書き出しできない環境です。コピーを使ってください')}};
  $('#cp').onclick=()=>navigator.clipboard.writeText(json()).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした'));
  $('#im').onclick=()=>{const i=$('#jsonIn');i.value='';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.cases||!d.books)throw 0;S=d;save();renderAll();closePanel();toast('読み込みました')}catch(e){toast('読み込めないファイルです')}};i.click()};
  $('#clr').onclick=()=>confirmP('すべての本と本棚を消して空にします。',()=>{S={books:{},tray:[],follows:[],cases:[{id:uid(),name:'わたしの本棚',shelves:[1,2,3].map(n=>({id:uid(),name:n+'段目',books:[]}))}]};S.cur=S.cases[0].id;save();renderAll()});
};

/* ---- 画面切替 ---- */
function renderAll(){renderShelf();renderList();renderNews();renderBadge()}
function show(v){for(const b of document.querySelectorAll('#tabs button'))b.setAttribute('aria-pressed',b.dataset.v===v);
  for(const s of ['shelf','list','news'])$('#v-'+s).hidden=s!==v;if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);
  if(v==='news'){if(newsStale())checkNews();S.newsSeen=(S.news?.items||[]).map(x=>x.isbn);save();setTimeout(renderBadge,1500)}}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
addEventListener('hashchange',()=>show(location.hash.slice(1)||'shelf'));
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(newsStale()&&Object.keys(S.books).length)setTimeout(()=>checkNews(),2500);
renderAll();show(['shelf','list','news'].includes(location.hash.slice(1))?location.hash.slice(1):'shelf');
}
</script>
</body>
</html>
