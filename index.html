<style>
/* VOICE: 静かで手ざわりのある、自分の部屋の本棚
   IDEA: 壁に据えた木の本棚。背表紙を並べ、好きな本だけ表紙を見せて飾る
   PICTURE: 本棚そのもの（棚板・影・背表紙・面陳）が画面の主役
   COLOUR/TYPE: 深い壁色＋胡桃材＋背表紙の色。Zen Kaku Gothic New
   LAYOUT: 上に細いツールバー、中央に本棚、右から詳細パネル */
:root{color-scheme:light dark;
--wall:#e7e2d8;--ink:#22201c;--mute:#6d675e;
--panel:#fffdf8;--line:#d6cfc2;
--wood:#8a5a35;--wood2:#6e4526;--woodhi:#b07c4f;
--back:#3b2a1e;--acc:#d9482b;--tray:#d9d2c5;--ok:#2f7d5b;--k:1}

:root[data-theme=dark]{color-scheme:dark;--wall:#1d2326;--ink:#ece7de;--mute:#a29b90;--panel:#272e31;--line:#3a4347;--wood:#6b4427;--wood2:#4f3019;--woodhi:#8a5b36;--back:#1a120c;--tray:#151a1c}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--wall);color:var(--ink);font:15px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
html,body{overscroll-behavior:none}.panel{overscroll-behavior:contain}.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 8px}.pbar i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .4s}
button.busy{opacity:1!important;cursor:progress;font-variant-numeric:tabular-nums}.iscroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button,input,select,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;min-height:40px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:16px;width:100%}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:calc(14px + env(safe-area-inset-top)) max(3vw,14px,env(safe-area-inset-right)) 14px max(3vw,14px,env(safe-area-inset-left))}
h1{font-size:26px;line-height:1.05;margin:0 12px 0 0;font-weight:900;letter-spacing:.02em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.sp{flex:1}
main{padding:0 max(3vw,14px) 40px}
.note{color:var(--mute);font-size:13px;margin:4px 0 12px}

 background:linear-gradient(180deg,#0006,#0000 30%),var(--back);box-shadow:inset 0 8px 18px #000a,inset 8px 0 14px -6px #0009,inset -8px 0 14px -6px #0009;scrollbar-width:thin}
.board{height:16px;background:linear-gradient(180deg,var(--woodhi),var(--wood) 35%,var(--wood2));box-shadow:0 6px 8px -4px #0009}
.empty{color:#e8d9c6;opacity:.5;font-size:13px;align-self:center;margin:auto}

@media(hover:hover){.bk:hover{transform:translateY(-6px)}}
.bk.lift{transform:translateY(-10px) scale(1.06)}
body.dragging{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.spine{width:calc(var(--w) * var(--k));height:calc(var(--h) * var(--k));background:var(--c);border-radius:2px 2px 0 0;color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 8px;
 box-shadow:inset 3px 0 4px -2px #fff5,inset -4px 0 5px -2px #0007;overflow:hidden}

.face{height:calc(var(--fh) * var(--k));width:calc(var(--fh) * var(--k) * .7);margin:0 6px;box-shadow:6px 4px 10px #000a;position:relative;background:var(--c);overflow:hidden;border-radius:1px}

.gen{position:absolute;inset:0;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;color:var(--t)}

.row.pile{flex-direction:column;align-items:center;gap:1px;padding:10px 12px 0;overflow-x:hidden;overflow-y:auto;height:calc(170px * var(--k) + 22px)}
.row.pile>:first-child{margin-top:auto}.row.pile .empty{margin:auto}
.row.pile .bk.pb{width:var(--pw);flex:none;translate:var(--px) 0;rotate:var(--pr)}
.pspine{height:calc(30px * var(--k) + 6px);background:var(--c);color:var(--t);border-radius:2px;display:flex;align-items:center;padding:0 12px;box-shadow:inset 0 3px 4px -2px #fff5,inset 0 -4px 5px -2px #0007,0 2px 3px #0005;font-weight:700;font-size:12.5px;overflow:hidden}
.pspine span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.pile .mark{width:70%;height:4px}
/* 読書中：椅子に座ってコーヒーを飲みながら本を読む棒人間。本は手に持った表紙 */
#readRow{padding-top:6px;gap:6px}
.reader{flex:none;position:relative;width:calc(160px*var(--k));height:calc(168px*var(--k))}
.reader svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:scaleX(-1)}
.reader .bk{position:absolute;left:calc(10px*var(--k));top:calc(40px*var(--k));perspective:500px}

.reader .ln{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.reader .steam path{fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;opacity:0;animation:steam 3s ease-in-out infinite}
.reader .steam path:nth-child(2){animation-delay:1s}.reader .steam path:nth-child(3){animation-delay:2s}

.tray{margin-top:22px;max-width:1240px}
.tray h3,.sec h3{font-size:16px;margin:0 0 6px}
.tray .row{background:var(--tray);box-shadow:inset 0 4px 10px #0003;min-height:170px;border-radius:6px}
.tray .empty{color:var(--mute);opacity:1}
/* パネル */
.panel{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--panel);box-shadow:-20px 0 40px #0005;padding:20px;overflow:auto;z-index:40;translate:105% 0;visibility:hidden;transition:translate .25s,visibility .25s}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.pinfo{display:flex;flex-direction:column;gap:4px;align-items:flex-start;align-self:stretch;justify-content:flex-start;min-width:0;line-height:1.45}.pinfo b{font-size:17px}.pinfo span{font-size:14px}.pinfo .note{margin:0}.pinfo button{margin-top:auto}
.msg{font-size:13px;color:var(--mute);min-height:1.5em}
.msg.err{color:var(--acc)}
/* 一覧・新刊 */
.sec{max-width:1240px}
.grid.iscroll{padding:4px 4px 16px;margin-left:-4px;margin-right:-4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 14px;margin-top:12px}
.card{white-space:normal;background:none;border:0;padding:0;text-align:left;min-height:0;display:flex;flex-direction:column;gap:6px}

.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{flex:1 1 220px;width:auto}.filters select{width:auto}

.toast.on{opacity:1}
.viewbar{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px}.viewbar[hidden]{display:none}.viewbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.viewbar button{min-height:36px;padding:4px 12px;font-size:13px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:46px;padding:8px 14px;border-radius:10px;text-align:left;font-weight:700}.pick small{font-weight:400;opacity:.7;white-space:nowrap}.pick[aria-pressed=true]{background:var(--ink);color:var(--wall);border-color:var(--ink)}.picks{display:flex;flex-direction:column;gap:6px}
#v-list.pm #fst,#v-list.pm #sort{display:none}
.listact{display:flex;align-items:center;gap:8px}.listact .note{flex:1;margin:0}.listact button{min-height:36px;padding:4px 12px;font-size:13px}
.cchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.cchips.one{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:3px 3px 4px;margin:0 -3px}.cchips.one::-webkit-scrollbar{display:none}.cchips.one>*{flex:none}.cchip{width:38px;height:38px;min-height:0;padding:0;border-radius:50%;background:var(--c);color:var(--t);border:2px solid #0002;font-weight:700}.cchip.on{outline:3px solid var(--acc);outline-offset:2px}
#seg{position:sticky;bottom:12px;z-index:29;box-shadow:0 6px 20px #0002}#v-news{display:flex;flex-direction:column}#v-news[hidden]{display:none}#seg{order:9;margin:16px 0 0}

#nlast,#rlast{display:none!important}#v-news .filters.ctr .pri{min-height:38px;padding:6px 18px;font-size:15px}#v-news .pbar{margin:6px 0 2px}#rmsg,#nmsg{margin:4px 0 2px;min-height:0;text-align:center;font-size:12.5px}#v-news .seg.sub{margin-bottom:8px}#v-news .rel{padding:8px 0;gap:10px}
.seg{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px;margin:0 0 14px}.seg button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;font-weight:700}

#caseName.multi{padding-right:18px;background:linear-gradient(45deg,transparent 50%,currentColor 50%) right 6px center/6px 6px no-repeat,linear-gradient(-45deg,transparent 50%,currentColor 50%) right 0 center/6px 6px no-repeat}

<script>
{
const KEY='hondana.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const PAL=[['#2d4a6b','#f1e9da'],['#7d2a2a','#f6e7d7'],['#e5c76b','#2a2420'],['#3d6b4f','#f2efe6'],['#ddd5c4','#2c2a26'],['#1f1f22','#e9c46a'],['#b4532a','#fff3e4'],['#5b4b8a','#f3eefc'],['#8fb3c9','#1c2a33'],['#c98b8b','#2b1d1d'],['#f2f0ea','#b4532a'],['#2a6f73','#fbefd9']];
/* 文字の色：背景の明るさを見て、白か黒の読みやすい方 */
function ink(c){const m=String(c).match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);if(!m)return '#ffffff';
  const l=m.slice(1).map(x=>{x=parseInt(x,16)/255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4});const Y=.2126*l[0]+.7152*l[1]+.0722*l[2];return Y>.3?'#1e1b18':'#ffffff'}
/* タイトルの言葉からおすすめの色 */
const KWC=[['赤|紅|血|炎|火|朱|薔薇|バラ','#a8322d'],['青|蒼|海|空|水|雨|波|ブルー','#2f5f8f'],['緑|森|葉|草|樹|林|グリーン','#3d6b4f'],['黒|闇|夜|影|死|殺|鬼|魔','#1f1f22'],['白|雪|氷|冬|雲','#e9e6de'],
  ['金|黄|光|陽|太陽|月|ゴールド','#d9b24a'],['桜|花|恋|愛|春|キス|ピンク','#e3a1b0'],['紫|すみれ','#5b4b8a'],['茶|珈琲|コーヒー|土|猫|犬','#7a5236'],['銀|鉄|機械|ロボ','#8e979f'],['橙|夕|秋|紅葉|オレンジ','#d9763a'],['星|宇宙|銀河|夢','#23305e'],['風|夏|空|旅','#4f95b8']];
function kwColor(t){t=String(t||'');let best=null,at=1e9;for(const [w,c] of KWC){const m=t.match(new RegExp(w));if(m&&m.index<at){at=m.index;best=c}}return best}
/* 写真の表紙から、多く使われている色をいくつか取り出す（自分で撮った写真だけ。ネットの表紙画像はブラウザの制限で色を読めない） */
function photoColors(src){return new Promise(ok=>{if(!src||!/^data:|^blob:/.test(src))return ok([]);const im=new Image();im.onload=()=>{try{const cv=document.createElement('canvas');cv.width=cv.height=32;const g=cv.getContext('2d');g.drawImage(im,0,0,32,32);
    const d=g.getImageData(0,0,32,32).data,B={};for(let i=0;i<d.length;i+=4){const r=d[i],gg=d[i+1],b=d[i+2];const k=(r>>5)+','+(gg>>5)+','+(b>>5);const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);const w=1+(mx-mn)/64;const o=(B[k]??={n:0,r:0,g:0,b:0});o.n+=w;o.r+=r*w;o.g+=gg*w;o.b+=b*w}
    const hx=v=>Math.round(v).toString(16).padStart(2,'0');ok(Object.values(B).sort((a,b)=>b.n-a.n).slice(0,4).map(o=>'#'+hx(o.r/o.n)+hx(o.g/o.n)+hx(o.b/o.n)))}catch(e){ok([])}};im.onerror=()=>ok([]);im.src=src})}
function recoColors(b,extra=[]){const L=[...extra,kwColor(b.title),(S.seriesStyle||{})[skey(b)]?.c,PAL[hash(skey(b)||b.isbn||b.title)%PAL.length][0],'#2d4a6b','#7d2a2a','#3d6b4f','#e5c76b','#1f1f22','#ddd5c4','#5b4b8a','#b4532a'].filter(Boolean);return [...new Set(L)].slice(0,9)}
function chipsHTML(cs,cur){return cs.map(c=>`<button type="button" class="cchip${c===cur?' on':''}" data-cc="${c}" style="--c:${c};--t:${ink(c)}" aria-label="${c}">あ</button>`).join('')}
const ST={unread:'積読',reading:'読書中',done:'読了',wish:'読みたい'};

/* 初回は空の本棚から始める */
const emptyState=()=>{const c={id:uid(),name:'わたしの本棚',shelves:['上段','中段','下段'].map(n=>({id:uid(),name:n,books:[]}))};return {books:{},tray:[],follows:[],cases:[c],cur:c.id}};
// 以前の版で最初から入っていたサンプルの本（ISBNと書名が両方一致するものだけを対象にする）
const SAMPLE_KEYS=new Set(['9784101010137:こころ','9784101010014:吾輩は猫である','9784062748681:ノルウェイの森 上','9784101215235:博士の愛した数式','9784591153321:かがみの孤城','9784893095626:りんごかもしれない','9784167911300:コンビニ人間','9784101092058:新編 銀河鉄道の夜','9784167910105:羊と鋼の森','9784101369181:火車','9784102122044:星の王子さま','9784101006055:人間失格']);
const sampleBooks=()=>Object.values(S.books).filter(b=>SAMPLE_KEYS.has(b.isbn+':'+b.title));
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
// 自分では1冊も登録していない（サンプルのまま）なら空の本棚にする
if(!S||!S.cases||S.sample===true){S=emptyState();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.cur||!S.cases.find(c=>c.id===S.cur))S.cur=S.cases[0].id;
/* 読了日：読了ではない状態から読了になった時に今日の日付を入れる（自分で日付を入れた時はそのまま） */
const PREV={},today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function trackDone(){for(const b of Object.values(S.books||{})){const p=PREV[b.id];if(b.status==='done'&&p&&p.s!=='done'&&(!b.doneAt||b.doneAt===p.d))b.doneAt=today();PREV[b.id]={s:b.status,d:b.doneAt}}}
trackDone();
const save=()=>{trackDone();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('この環境では保存できません')}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)};
const curCase=()=>S.cases.find(c=>c.id===S.cur);

/* ---- シリーズと巻数（書名の末尾の数字・上中下から自動判定。詳細画面で直せる） ---- */
const z2h=t=>String(t||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));
const VOL_RE=/[\s　]*(?:[（(［\[]\s*)?(?:第|巻|vol\.?|Vol\.?|VOL\.?|#)?\s*(\d{1,4}|上|中|下)\s*(?:巻|集|号)?\s*(?:[)）］\]])?\s*$/;
function volOf(b){if(b.vol!==undefined&&b.vol!=='')return parseFloat(z2h(b.vol))||0;const m=z2h(b.title).match(VOL_RE);if(!m)return 0;return {上:1,中:2,下:3}[m[1]]||parseInt(m[1])}
// 「葬送のフリーレン = FRIEREN.」のような併記タイトルを外す
const cleanTitle=t=>String(t||'').replace(/\s+[=＝]\s.*$/,m=>{const v=z2h(m).match(VOL_RE);return v?' '+v[0].trim():''}).trim();
function seriesOf(b){if(b.series)return b.series.trim();const t=cleanTitle(z2h(b.title));const m=t.match(VOL_RE);return (m?t.slice(0,m.index):t).replace(/[\s　.,:：・-]+$/,'').trim()}
const byVol=(a,b)=>seriesOf(S.books[a]).localeCompare(seriesOf(S.books[b]),'ja')||volOf(S.books[a])-volOf(S.books[b]);
/* ---- 本の見た目 ---- */
/* 背表紙は単色。同じシリーズは色・高さ・幅がそろう。色は 本ごとの指定 → シリーズの指定 → 自動 の順 */
// 書名の表記ゆれ（スペース・記号・全角半角）があっても同じシリーズとして扱う
const skey=b=>z2h(seriesOf(b)).toLowerCase().replace(/[\s　・.,:：!！?？『』「」()（）\-]/g,'');
function look(b,own=true){const k=skey(b),h=hash(k||b.isbn||b.title);const st=(S.seriesStyle||{})[k];
  const p=own&&b.color?[b.color]:st?[st.c]:[kwColor(b.title)||PAL[h%PAL.length][0]];
  return {c:p[0],t:ink(p[0]),h:KH[kindOf(b)],w:34}}
/* 本の種類で背の高さを変える：単行本＝段いっぱい、マンガ＝標準、文庫＝少し低い */
const KH={book:200,manga:170,bunko:156},KIND={book:'単行本',bunko:'文庫',manga:'マンガ'};
const guessKind=b=>{const t=[b.title,b.series,b.publisher,b.label].join(' ');return /文庫/.test(t)?'bunko':/コミック|COMICS|Comics|comics|漫画|マンガ|ジャンプ|マガジン|サンデー|チャンピオン/.test(t)?'manga':'book'};
/* 種類の決め方：自分で選んだもの → 分類コード → 同じシリーズのほかの巻 → 書名などからの推測 */
const kindOf=b=>{if(KIND[b.kind])return b.kind;const k=skey(b);if(k){const c={};for(const x of Object.values(S.books))if(x!==b&&KIND[x.kind]&&skey(x)===k)c[x.kind]=(c[x.kind]||0)+1;const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(best)return best[0]}return KIND[b.cat]?b.cat:guessKind(b)};
/* openBD の Cコード（2けた目：1＝文庫、9＝コミック）から種類を決める */
function ccKind(j){const sub=j?.onix?.DescriptiveDetail?.Subject||[];const c=(sub.find(x=>x.SubjectSchemeIdentifier==='78')||{}).SubjectCode||'';const m=String(c).match(/^C?\d(\d)(\d\d)$/);
  // Cコード：2けた目＝形（1文庫・9コミック）、3〜4けた目＝内容（79＝コミック）。マンガの単行本は形が0でも内容が79
  return m?(m[2]==='79'||m[1]==='9'?'manga':m[1]==='1'?'bunko':'book'):''}
async function fillKinds(){if(S.kindV!==2){for(const b of Object.values(S.books))if(b.kindSrc!=='user')delete b.kind;S.kindV=2}
  const L=Object.values(S.books).filter(b=>!b.kind&&/^97[89]\d{10}$/.test(b.isbn||''));let ch=0;
  for(let i=0;i<L.length;i+=100){const part=L.slice(i,i+100);try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+part.map(b=>b.isbn).join(','));const j=await r.json();
    part.forEach((b,k)=>{const kd=ccKind(j[k]);if(kd&&S.books[b.id]){S.books[b.id].kind=kd;ch++}})}catch(e){}}
  if(ch){save();renderShelf()}}

/* 表紙画像：自分で選んだ画像 → ISBNから Google ブックスの表紙画像（画像がない本は灰色の仮画像が返るので、幅で見分けて外す） */
const coverSrc=b=>b.cover||(b.isbn&&/^97[89]\d{10}$/.test(b.isbn)?`https://books.google.com/books/content?vid=ISBN${b.isbn}&printsec=frontcover&img=1&zoom=1&fife=w400`:'');
/* 表紙が読めなかったとき：端末に保存した壊れた画像を消し、少し待って1回だけ取り直す（更新直後に一度に頼むと断られることがあるため） */
const gUrl=isbn=>/^97[89]\d{10}$/.test(isbn||'')?`https://books.google.com/books/content?vid=ISBN${isbn}&printsec=frontcover&img=1&zoom=1&fife=w400`:'';
function coverBad(img){const src=img.src;try{caches.open('hondana-img').then(c=>c.delete(src))}catch(e){}

  if(n<2&&img.dataset.g){setTimeout(()=>{if(img.isConnected)img.src=src.replace(/&r=\d+$/,'')+'&r='+(n+1)},1500+Math.random()*2500);return}

<g class="steam"><path d="M79 40q-3-4 0-8t0-8"/><path d="M84 40q-3-4 0-8t0-8"/><path d="M89 40q-3-4 0-8t0-8"/></g>

function renderSampleBar(){const L=S.sampleKeep?[]:sampleBooks();$('#sampleBar').hidden=!L.length;$('#sampleTxt').textContent=`最初から入っていたサンプルの本が${L.length}冊残っています。`;$('#emptyNote').hidden=Object.keys(S.books).length>0}

const bottomList=()=>{const c=curCase();for(let i=c.shelves.length-1;i>=0;i--)if(c.shelves[i].books.some(id=>S.books[id]))return c.shelves[i].books;return c.shelves[0].books};
function sweepTray(){const t=(S.tray||[]).filter(id=>S.books[id]&&!S.cases.some(c=>c.shelves.some(x=>x.books.includes(id))));S.tray=[];if(t.length){bottomList().push(...t);save()}return t.length}

function renderPages(c,zf){$('#case').dataset.theme=VIEW?'':(c.theme||'');$('#viewBar').hidden=!VIEW;if(VIEW)$('#viewTxt').textContent=VIEW.label;$('#pgnav').hidden=false;const el=$('#case');const mob=matchMedia('(max-width:600px)').matches;
  const k=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k'))||1;
  const W=el.clientWidth||Math.min(document.querySelector('main').clientWidth,1240);PW=W;
  // いつも1ページ3段。画面の高さに収まるように、ページ全体を縮める
  const shH=mob?200:240,per=3;const top=Math.max(60,Math.min(240,el.getBoundingClientRect().top+scrollY||110));
  const lim=shelfLimit();const z=zf||Math.max(.45,Math.min(1,(lim-top-4)/(per*shH+(mob?8:14))));el.style.setProperty('--z',z.toFixed(3));
  const inner=W/z-(mob?12:28)-(mob?16:24)-8;

  for(const sh of SRC){const out=[[]];let w=0;for(const id of sh.books){const bw=bookW(id,k);if(w+bw>inner&&out.at(-1).length){out.push([]);w=0}out.at(-1).push(id);w+=bw}
    out.forEach((part,i)=>rows.push(`<div class="shelf"><button class="sname" data-sid="${sh.id}" title="段の名前を変更・削除">${esc(sh.name)}${i?'<span class="pn">のつづき</span>':''}</button>
      <div class="row" data-shelf="${sh.id}" data-next="${out[i+1]?.[0]||''}">${part.map(bookHTML).join('')||'<span class="empty">ここに本をドラッグ</span>'}</div><div class="board"></div></div>`))}

/* 本棚が使える下の端：スマホは下のタブの上まで、パソコンは画面の下まで */
function shelfLimit(){const t=$('#tabs'),n=$('#pgnav');if(getComputedStyle(n).position==='fixed')return n.getBoundingClientRect().top-8;return (getComputedStyle(t).position==='fixed'?t.getBoundingClientRect().top:innerHeight)-8-(n.offsetHeight+8)}
function renderPgNav(){const n=$('#pgnav');n.hidden=false;const bar=$('#pgBar');bar.disabled=PAGES<2;bar.max=Math.max(1,PAGES-1);if(document.activeElement!==bar||!bar.matches(':active'))bar.value=PAGE;$('#pgNo').textContent=`${PAGE+1} / ${PAGES}`;$('#pgPrev').disabled=PAGE<=0;$('#pgNext').disabled=PAGE>=PAGES-1}

const ACTS={open:'詳細を開く',reading:'読書中にする',done:'読了にする',unread:'積読にする',flip:'表紙と背表紙を切り替える',move:'動かす',none:'何もしない'};

/* ---- 追加：ISBN検索 ---- */
function normIsbn(s){s=String(s||'').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(s.length===10){const b='978'+s.slice(0,9);let t=0;for(let i=0;i<12;i++)t+=+b[i]*(i%2?3:1);return b+((10-t%10)%10)}
  return s.length===13?s:''}
async function lookup(isbn){
  try{const r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn);const j=await r.json();const s=j?.[0]?.summary;
    if(s){const kd=ccKind(j[0]);return {title:[cleanTitle(s.title),s.volume].filter(Boolean).join(' '),author:obdAuthor(s.author),publisher:s.publisher||'',pubdate:fmtDate(s.pubdate),cover:s.cover||'',src:'openBD',...(kd?{kind:kd}:{})}}}catch(e){}
  try{const r=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);const j=await r.json();const v=j.items?.[0]?.volumeInfo;
    if(v)return {title:[v.title,v.subtitle].filter(Boolean).join(' '),author:(v.authors||[]).join('・'),publisher:v.publisher||'',pubdate:v.publishedDate||'',cover:(v.imageLinks?.thumbnail||'').replace('http:','https:'),src:'Google Books'}}catch(e){}
  try{const r=await ndl('isbn='+isbn+'&cnt=5');const n=r.find(x=>x.isbn===isbn)||r[0];if(n)return {...n,isbn,src:'国立国会図書館サーチ'}}catch(e){}
  return null}
const obdAuthor=t=>{t=String(t||'').replace(/\s*(／|\/)?\s*(著|作|文|絵|訳|編)(?=\s|$)/g,' ').trim();return t.includes(',')?t.split(/\s+/).map(ndlName).filter(Boolean).join('・'):t.replace(/[／]/g,'・')};
/* 国立国会図書館サーチ OpenSearch（新刊・発売予定も含む） */
const ndlDate=d=>{d=String(d||'').trim();let m=d.match(/^(\d{4})[-.年](\d{1,2})(?:[-.月](\d{1,2}))?/);if(m)return [m[1],m[2].padStart(2,'0'),m[3]?.padStart(2,'0')].filter(Boolean).join('-');return d.slice(0,4)};
const ndlName=t=>{t=t.replace(/[\s　]*(著|作|文|絵|訳|編)$/,'').replace(/,\s*\d{4}-(\d{4})?\s*$/,'').trim();const p=t.split(/\s*,\s*/);return /[A-Za-z]/.test(t)?p.reverse().join(' '):p.join('').replace(/\s+/g,'')};
async function ndl(qs){let r;for(let k=0;k<3;k++){r=await fetch('https://ndlsearch.ndl.go.jp/api/opensearch?'+qs);if(r.status!==429)break;await new Promise(o=>setTimeout(o,1500*(k+1)))}if(!r.ok)throw 0;
  const d=new DOMParser().parseFromString(await r.text(),'text/xml');const g=(i,t)=>i.getElementsByTagName(t)[0]?.textContent?.trim()||'';
  return [...d.getElementsByTagName('item')].map(i=>{const ids=[...i.getElementsByTagName('dc:identifier')];
    const isbn=normIsbn((ids.find(e=>/ISBN/.test(e.getAttribute('xsi:type')||''))||{}).textContent);
    return {isbn,title:[cleanTitle(g(i,'dc:title')||g(i,'title')),g(i,'dcndl:volume')].filter(Boolean).join(' '),author:[...i.getElementsByTagName('dc:creator')].map(e=>ndlName(e.textContent)).filter((v,k,a)=>a.indexOf(v)===k).join('・'),
      publisher:g(i,'dc:publisher'),pubdate:ndlDate(g(i,'dcterms:issued')),cover:'',cat:ndlCat(i)}})}
/* 本の種類：マンガ／小説（文庫）／小説（単行本）。国立国会図書館の分類（NDC・NDLC）とシリーズ名で見分ける。どれでもなければ空 */
function ndlCat(i){const pl=i.getElementsByTagName('dcndl:publicationPlace')[0]?.textContent?.trim();if(pl&&pl!=='JP')return '';const sub=[...i.getElementsByTagName('dc:subject')].map(e=>(e.getAttribute('xsi:type')||'')+':'+e.textContent.trim());
